services:
  # =========================================================
  # 1. BACKEND WEB SERVICE (Node.js Express API)
  # =========================================================
  - type: web
    name: attendance-tracker-backend
    runtime: node
    plan: free
    rootDir: attendance-tracker-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

  # =========================================================
  # 2. FRONTEND STATIC SITE (Vite + React + Tailwind CSS)
  # =========================================================
  - type: web
    name: attendance-tracker-frontend
    runtime: static
    rootDir: attendance-tracker-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
